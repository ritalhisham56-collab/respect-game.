<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي الاحترام</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color-scheme:light dark;--bg:light-dark(#f7f8fc,#10131b);--card:light-dark(#fff,#1b2030);--text:light-dark(#172033,#f5f7ff);--muted:light-dark(#667085,#aab3c7);--accent:#7c5cff;--good:#21a66a;--bad:#e05252;--line:light-dark(#e6e8ef,#30384b)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg);padding:28px}.wrap{max-width:980px;margin:auto}.hero{text-align:center;margin-bottom:22px}.hero h1{font-size:42px;margin:8px 0}.hero p{color:var(--muted);margin:0}.scorebar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}.pill{background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tile{min-height:120px;border:1px solid var(--line);background:var(--card);border-radius:20px;cursor:pointer;font-size:24px;font-weight:700;color:var(--text);box-shadow:0 5px 18px #0001;transition:.2s}.tile:hover{transform:translateY(-3px);border-color:var(--accent)}.tile.used{opacity:.35;cursor:default;transform:none}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{max-width:700px;width:100%;background:var(--card);border-radius:24px;padding:28px;border:1px solid var(--line)}.tag{display:inline-block;background:#7c5cff22;color:#7c5cff;padding:7px 12px;border-radius:999px;font-weight:700}.q{font-size:25px;line-height:1.6;margin:20px 0}.answers{display:grid;gap:10px}.answer{padding:15px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:14px;text-align:right;font-size:17px;cursor:pointer}.answer:hover{border-color:var(--accent)}.answer.correct{background:#21a66a22;border-color:var(--good)}.answer.wrong{background:#e0525222;border-color:var(--bad)}.feedback{margin:16px 0;font-weight:700}.actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.hidden{display:none}.finish{text-align:center;background:var(--card);padding:30px;border-radius:24px;border:1px solid var(--line);margin-top:20px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:32px}.tile{min-height:100px}}
</style></head><body><main id="app"><div class="wrap"><section class="hero"><div style="font-size:44px">🤝✨</div><h1>تحدي الاحترام</h1><p>اختر بطاقة، اقرأ الموقف، ثم اختر التصرف الأكثر احترامًا.</p></section><div class="scorebar"><div class="pill">⭐ النقاط: <b id="score">0</b></div><div class="pill">🎯 البطاقات: <b id="done">0</b>/12</div></div><div class="grid" id="grid"></div><section class="finish hidden" id="finish"><h2>🏆 أحسنت!</h2><p id="finalText"></p><button class="btn primary" onclick="location.reload()">العب مرة أخرى</button></section></div><div class="modal" id="modal"><div class="box"><span class="tag" id="tag"></span><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn primary hidden" id="next">البطاقة التالية</button><button class="btn secondary" onclick="closeModal()">إغلاق</button></div></div></div></main><script>
const data=[
['احترام الأصدقاء','صديقك يشرح فكرته، وأنت لا توافقه. ماذا تفعل؟',['أقاطعه وأقول إن فكرته خاطئة','أستمع إليه ثم أعبّر عن رأيي بأدب','أضحك على فكرته','أتجاهله'],1],
['الاختلاف','زميلك لديه رأي مختلف عن رأيك.',['أحترم رأيه حتى لو اختلفت معه','أجبره على تغيير رأيه','أسخر منه','أغضب منه'],0],
['الاستماع','شخص يتحدث معك عن مشكلة.',['أنظر إلى هاتفي','أقاطعه باستمرار','أستمع إليه باهتمام','أغير الموضوع فورًا'],2],
['المدرسة','رأيت طالبًا جديدًا يجلس وحده.',['أتجاهله','أرحب به وأحاول إشراكه','أضحك عليه','أطلب من الآخرين عدم الكلام معه'],1],
['التنمر','سمعت شخصًا يسخر من زميله.',['أضحك معه','أصور الموقف','أشارك في السخرية','أرفض السخرية وأدعم زميلي'],3],
['الاختلاف الثقافي','زميلك لديه عادات مختلفة عنك.',['أحترم اختلافه وأتعرف عليه','أقول إن عاداتي أفضل','أسخر من عاداته','أتجنب الحديث معه'],0],
['الاعتذار','أخطأت في حق شخص دون قصد.',['ألومه','أتجاهل الأمر','أعتذر بصدق وأحاول إصلاح الخطأ','أقول له إنه حساس جدًا'],2],
['الإنترنت','وصلتك رسالة لا توافق رأيها.',['أرد بإهانة','أكتب ردًا محترمًا أو أتجاهلها','أنشرها للسخرية','أرسلها لأصدقائي للضحك'],1],
['الممتلكات','وجدت شيئًا ليس لك في الفصل.',['آخذه لنفسي','أخفيه','أسلمه للمعلم أو صاحبه','أتركه في مكان آخر'],2],
['الخصوصية','صديقك أخبرك بشيء شخصي.',['أنشره في المجموعة','أخبر شخصًا واحدًا فقط','أحترم خصوصيته ولا أنشره','أستخدمه ضده'],2],
['الخلاف','اختلفت مع صديقك وبدأ النقاش يصبح حادًا.',['أصرخ أكثر','أهينه','أهدأ وأتحدث باحترام','أهدد بقطع علاقتنا'],2],
['المساعدة','زميلك لم يفهم جزءًا من الدرس.',['أقول له هذا ليس شأني','أسخر منه','أساعده أو أشرح له بهدوء','أخبر الآخرين أنه لا يفهم'],2]
];
let score=0,done=0,current=-1,answered=false;const grid=document.getElementById('grid');data.forEach((d,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`<div>⭐</div>البطاقة ${i+1}`;b.onclick=()=>openCard(i,b);grid.appendChild(b)});
function openCard(i,b){if(b.classList.contains('used'))return;current=i;answered=false;document.getElementById('tag').textContent=data[i][0];document.getElementById('question').textContent=data[i][1];document.getElementById('feedback').textContent='';const a=document.getElementById('answers');a.innerHTML='';data[i][2].forEach((x,j)=>{const el=document.createElement('button');el.className='answer';el.textContent=x;el.onclick=()=>answer(j,el);a.appendChild(el)});document.getElementById('next').classList.add('hidden');document.getElementById('modal').classList.add('show')}
function answer(j,el){if(answered)return;answered=true;const d=data[current];[...document.querySelectorAll('.answer')][d[3]].classList.add('correct');if(j===d[3]){score+=10;document.getElementById('feedback').textContent='✅ إجابة رائعة! هذا تصرف يحافظ على الاحترام.'}else{el.classList.add('wrong');document.getElementById('feedback').textContent='💡 حاول التفكير: الاحترام يعني تقدير الآخرين حتى عند الاختلاف.'}document.getElementById('score').textContent=score;document.querySelectorAll('.tile')[current].classList.add('used');done++;document.getElementById('done').textContent=done;document.getElementById('next').classList.remove('hidden');if(done===12)document.getElementById('next').textContent='عرض النتيجة'}
document.getElementById('next').onclick=()=>{if(done===12){closeModal();document.getElementById('finish').classList.remove('hidden');document.getElementById('finalText').textContent=`حصلت على ${score} من 120 نقطة. تذكّر: الاحترام لا يعني أن نتفق دائمًا، بل أن نختلف بأدب ونقدّر الآخرين.`}else closeModal()};function closeModal(){document.getElementById('modal').classList.remove('show')}
</script></body></html>
